spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.open-in-view=false

spring.thymeleaf.cache=true
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

leadpulse.bootstrap-key=${LEADPULSE_BOOTSTRAP_KEY}
leadpulse.admin.username=${LEADPULSE_ADMIN_USERNAME}
leadpulse.admin.password-bcrypt=${LEADPULSE_ADMIN_PASSWORD_BCRYPT}
leadpulse.rate-limit.requests=${LEADPULSE_RATE_LIMIT_REQUESTS:120}
leadpulse.rate-limit.window-seconds=${LEADPULSE_RATE_LIMIT_WINDOW_SECONDS:60}
leadpulse.cors.allowed-origins=${LEADPULSE_ALLOWED_ORIGINS}
